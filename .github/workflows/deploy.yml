name: Deploy FE to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout source
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # Login GHCR
      # =========================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # =========================
      # Set up Docker Buildx (for caching)
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Build & push FE image with GHA Cache
      # =========================
      - name: Build & push FE image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fe-app:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_PHONE_NUMBER=${{ secrets.VITE_PHONE_NUMBER }}
            VITE_ZALO_PHONE_NUMBER=${{ secrets.VITE_ZALO_PHONE_NUMBER }}
            VITE_EMAIL_CONTACT=${{ secrets.VITE_EMAIL_CONTACT }}
            VITE_COMPANY_ADDRESS=${{ secrets.VITE_COMPANY_ADDRESS }}
            VITE_COMPANY_WORKING_HOURS=${{ secrets.VITE_COMPANY_WORKING_HOURS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # Deploy to VPS
      # =========================
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🔐 Login GHCR"
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            echo "🧹 Remove old image"
            docker rmi ghcr.io/${{ github.repository_owner }}/fe-app:latest || true

            echo "⬇️ Pull new image"
            docker pull ghcr.io/${{ github.repository_owner }}/fe-app:latest

            echo "🛑 Stop old container"
            docker stop fe-app || true
            docker rm fe-app || true

            echo "🚀 Run new container"
            docker run -d \
              --name fe-app \
              --network thienloc-net \
              -p 3000:80 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/fe-app:latest

            echo "✅ FE container status"
            docker ps | grep fe-app
