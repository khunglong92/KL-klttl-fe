name: Deploy FE to VPS

on:
  push:
    branches:
      - master

# Nếu push liên tiếp, hủy các lần chạy cũ đang chờ/đang chạy để tránh
# nhiều deploy tranh nhau container/network trên VPS cùng lúc.
concurrency:
  group: deploy-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Chặn trường hợp một step bị treo (SSH/pull mạng chậm) ăn hết nhiều giờ
    # mà không ai biết — sau 20 phút coi như fail để dễ phát hiện & retry.
    timeout-minutes: 20

    steps:
      # =========================
      # Checkout source
      # =========================
      - name: Checkout source
        uses: actions/checkout@v4

      # =========================
      # Login GHCR
      # =========================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # =========================
      # Set up Docker Buildx (for caching)
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================
      # Build & push FE image with GHA Cache
      # =========================
      - name: Build & push FE image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fe-app:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_PHONE_NUMBER=${{ secrets.VITE_PHONE_NUMBER }}
            VITE_ZALO_PHONE_NUMBER=${{ secrets.VITE_ZALO_PHONE_NUMBER }}
            VITE_EMAIL_CONTACT=${{ secrets.VITE_EMAIL_CONTACT }}
            VITE_COMPANY_ADDRESS=${{ secrets.VITE_COMPANY_ADDRESS }}
            VITE_COMPANY_WORKING_HOURS=${{ secrets.VITE_COMPANY_WORKING_HOURS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================
      # Deploy to VPS
      # =========================
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "🔐 Login GHCR"
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            echo "⬇️ Pull new image"
            docker pull ghcr.io/${{ github.repository_owner }}/fe-app:latest

            echo "🛑 Stop old container"
            docker stop fe-app || true
            docker rm fe-app || true

            echo "🚀 Run new container"
            docker run -d \
              --name fe-app \
              --network thienloc-net \
              -p 3000:80 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/fe-app:latest

            echo "🩺 Health check: đợi container thật sự chạy ổn định"
            sleep 3
            if [ "$(docker inspect -f '{{.State.Running}}' fe-app)" != "true" ]; then
              echo "❌ Container fe-app không chạy sau khi start. Logs:"
              docker logs --tail 100 fe-app
              exit 1
            fi
            echo "✅ FE container status"
            docker ps | grep fe-app

            echo "🧹 Dọn image cũ (giữ image đang dùng, xoá image không còn container nào tham chiếu)"
            docker image prune -f
