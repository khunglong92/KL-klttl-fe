name: Deploy FE to VPS

on:
  push:
    branches:
      - master
  # Cho phép chạy tay từ tab Actions trên GitHub khi cần deploy lại
  # mà không có thay đổi code mới (ví dụ chỉ đổi secret build-arg).
  workflow_dispatch:

# Nếu push liên tiếp, hủy các lần chạy cũ đang chờ/đang chạy để tránh
# nhiều deploy tranh nhau container/network trên VPS cùng lúc.
concurrency:
  group: deploy-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================
  # Job 1: Build & push image
  # =========================
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Tag theo git SHA để VPS chạy đúng chính xác bản vừa build (rollback được
      # bằng cách deploy lại 1 SHA cũ), không chỉ phụ thuộc vào "latest" mơ hồ.
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push FE image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fe-app:latest
            ghcr.io/${{ github.repository_owner }}/fe-app:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_PHONE_NUMBER=${{ secrets.VITE_PHONE_NUMBER }}
            VITE_ZALO_PHONE_NUMBER=${{ secrets.VITE_ZALO_PHONE_NUMBER }}
            VITE_EMAIL_CONTACT=${{ secrets.VITE_EMAIL_CONTACT }}
            VITE_COMPANY_ADDRESS=${{ secrets.VITE_COMPANY_ADDRESS }}
            VITE_COMPANY_WORKING_HOURS=${{ secrets.VITE_COMPANY_WORKING_HOURS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================
  # Job 2: Deploy to VPS
  # (job riêng — nếu chỉ bước SSH/deploy lỗi, có thể "Re-run failed jobs"
  # để chạy lại đúng job này, không cần build lại image từ đầu)
  # =========================
  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e

            echo "🔐 Login GHCR"
            docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_TOKEN }}

            echo "⬇️ Pull image (tag: ${{ needs.build.outputs.tag }})"
            docker pull ghcr.io/${{ github.repository_owner }}/fe-app:${{ needs.build.outputs.tag }}
            docker tag ghcr.io/${{ github.repository_owner }}/fe-app:${{ needs.build.outputs.tag }} ghcr.io/${{ github.repository_owner }}/fe-app:latest

            echo "🛑 Stop old container"
            docker stop fe-app || true
            docker rm fe-app || true

            echo "🚀 Run new container"
            docker run -d \
              --name fe-app \
              --network thienloc-net \
              -p 3000:80 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/fe-app:${{ needs.build.outputs.tag }}

            echo "🩺 Health check: đợi container thật sự chạy ổn định"
            sleep 3
            if [ "$(docker inspect -f '{{.State.Running}}' fe-app)" != "true" ]; then
              echo "❌ Container fe-app không chạy sau khi start. Logs:"
              docker logs --tail 100 fe-app
              exit 1
            fi
            echo "✅ FE container status"
            docker ps | grep fe-app

            echo "🧹 Dọn image cũ (giữ image đang dùng, xoá image không còn container nào tham chiếu)"
            docker image prune -f
